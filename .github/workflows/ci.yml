name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  qualidade:
    name: Qualidade (tipos, lint, testes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Type-check (tsc)
        run: npm run typecheck

      # O passo de lint (eslint + prettier) entra no gate APÓS uma passada
      # dedicada de formatacao (`npx prettier --write`). Hoje ha ~980 ajustes
      # de formatacao pendentes que deixariam o CI vermelho sem motivo de bug.
      # Enquanto isso, rode localmente quando quiser: `npm run lint:ci`.
      - name: Testes (jest)
        run: npm run test:ci
