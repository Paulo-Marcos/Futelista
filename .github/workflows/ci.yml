name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  qualidade:
    name: Qualidade (tipos, lint, testes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Lint (eslint + prettier)
        run: npm run lint:ci

      - name: Testes (jest)
        run: npm run test:ci
